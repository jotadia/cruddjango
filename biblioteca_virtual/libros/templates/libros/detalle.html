{% extends 'base.html' %}
{% block title %}Detalle libro - Biblioteca Virtual{% endblock %}
{% block content %}

<h1>{{ libro.titulo }}</h1>
<h2>{{ libro.autor }}</h2>
<p>Se publicó el {{ libro.fecha_publicacion }} y su status es 
    {% if libro.disponible %}
    ✅
    {% else %}
    🚫
    {% endif %}
    </p>
{% endblock %}
